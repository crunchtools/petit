name: Container

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*"]
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday 05:17 UTC: pick up base-image CVE fixes
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.39.1
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/petit
      default-branch: master
      # petit is a CLI, not a server. Gate it the way production uses it: run
      # the pushed digest over a real log and require the exact output the
      # test suite recorded as known-good, not just that --version prints.
      boot: command
      boot-command: |
        set -e
        podman run --rm "$IMAGE" --version
        out="$(podman run --rm -v "$PWD/test/data:/data:ro,Z" "$IMAGE" --hash /data/test01.log)"
        [ "$out" = "$(cat test/output/test01-hash.output)" ]
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
