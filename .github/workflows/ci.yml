# The repo's own checks, from python-sdlc at the release .pre-commit-config.yaml
# pins -- the same image and the same commands the laptop runs, so a green push
# predicts a green CI (constitution XII, v1.30.0).
#
# NOT every check on this pull request: Gourmand and Gatehouse run as their own
# workflows, which is why `sdlc ci` leaves them out (XII: "CI runs push's checks
# except Gourmand and Gatehouse, which CI runs through their own workflows").
#
# The job NAME `sdlc ci` is the required check in the org ruleset "Python SDLC
# gates". Renaming the job stops it gating, silently.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdlc:
    name: sdlc ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release is read from .pre-commit-config.yaml, so one line pins the
      # launcher, the image and every tool in it, for the laptop and CI both.
      - name: sdlc ci
        run: |
          set -eu
          rev=$(awk '/repo: https:\/\/github.com\/crunchtools\/python-sdlc/ {f=1; next}
                     f && /rev:/ {print $2; exit}' .pre-commit-config.yaml)
          [ -n "$rev" ] || { echo "no python-sdlc rev in .pre-commit-config.yaml" >&2; exit 2; }
          git clone -q --depth 1 --branch "$rev" https://github.com/crunchtools/python-sdlc "$RUNNER_TEMP/sdlc"
          $RUNNER_TEMP/sdlc/bin/sdlc ci

  gourmand:
    name: Code Quality (Gourmand)
    uses: crunchtools/gatehouse/.github/workflows/gourmand.yml@v0
