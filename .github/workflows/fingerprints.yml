name: Fingerprints

# Dependabot for the reboot corpora (#37). Ask endoflife.date which releases
# are supported, capture a clean reboot of each under QEMU/KVM, and open a PR
# when a corpus is new, has drifted, or has reached end of life. See
# tools/fingerprints/refresh.py and docs/internal/drivers.md.

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated platform ids to capture (empty: all)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: fingerprints
  cancel-in-progress: false

env:
  BRANCH: fingerprints/update

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Plan
        id: plan
        env:
          ONLY: ${{ inputs.platforms }}
        run: |
          uv run python tools/fingerprints/refresh.py check ${ONLY:+--only "$ONLY"} --output plan.json
          echo "matrix=$(jq -c '[.capture[].id]' plan.json)" >> "$GITHUB_OUTPUT"

  capture:
    needs: check
    if: needs.check.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # Rocky 8's image is 2 GB from a slow mirror.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils

      - name: Capture
        run: |
          uv run python tools/fingerprints/refresh.py capture "$PLATFORM" \
            --out "captures/$PLATFORM" --work "$RUNNER_TEMP/work"

      - uses: actions/upload-artifact@v7
        with:
          name: capture-${{ matrix.platform }}
          path: captures/

      - name: Keep the console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: console-${{ matrix.platform }}
          path: ${{ runner.temp }}/work/**/console.log

  propose:
    needs: [check, capture]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # The crunchtools-ci App's token, not a personal one: it has its own rate
      # limit, so a throttled account can't stop this step.
      - name: Mint CI token
        id: ci-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CRUNCHTOOLS_CI_APP_ID || secrets.CRUNCHTOOLS_CI_APP_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools

      # The org doesn't let github.token open PRs, so the bot pushes and opens
      # them with the crunchtools-ci App token. That also starts CI on the PR.
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.ci-token.outputs.token }}

      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: capture-*
          path: captures
          merge-multiple: true

      - name: Propose
        id: propose
        run: |
          mkdir -p captures
          uv run python tools/fingerprints/refresh.py propose captures --summary body.md
          if [ "${{ needs.capture.result }}" = failure ]; then
            printf '\nSome captures failed; see %s.\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> body.md
          fi

      - name: Open or update the PR
        if: steps.propose.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.ci-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/petit/data/fingerprints test/data/verify tools/fingerprints/captured.json
          git commit -m "feat: refresh reboot fingerprint corpora (#37)"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --body-file body.md
          else
            gh pr create --base master --head "$BRANCH" \
              --title "feat: refresh reboot fingerprint corpora" --body-file body.md
          fi

  # Every capture, whole and scrubbed, goes to a public archive for tuning
  # stop words and fingerprints later. A repo of its own, not a branch here:
  # a clone of petit would otherwise download all of it.
  archive:
    needs: [check, capture]
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: capture-*
          path: captures
          merge-multiple: true

      # The crunchtools-ci App's token, not a personal one: it has its own rate
      # limit, so a throttled account can't stop this step.
      - name: Mint CI token
        id: ci-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CRUNCHTOOLS_CI_APP_ID || secrets.CRUNCHTOOLS_CI_APP_ID }}
          private-key: ${{ secrets.CRUNCHTOOLS_CI_APP_KEY }}
          owner: crunchtools

      - uses: actions/checkout@v7
        with:
          repository: crunchtools/petit-captures
          token: ${{ steps.ci-token.outputs.token }}
          path: archive

      - name: Push to crunchtools/petit-captures
        run: |
          if [ -z "$(ls -A captures 2>/dev/null)" ]; then
            echo "No captures to archive."; exit 0
          fi
          # One directory per run, so a second run on the same day adds to
          # the archive instead of overwriting it.
          dest="$(date -u +%F)/$GITHUB_RUN_ID"
          mkdir -p "archive/$dest"
          cp -r captures/. "archive/$dest/"
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dest"
          git diff --cached --quiet && { echo "Already archived."; exit 0; }
          git commit -m "captures: $dest ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          # Runs are serialized by the workflow's concurrency group; this only
          # covers a push to the archive from somewhere else.
          git push || { git pull --rebase -q && git push; }
