[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petit-log-crunchtools"
version = "4.10.4"
description = "Log analysis for systems administrators — detects the log format, then collapses the repetitive into counts so the unusual is what you read"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "Scott McCarty", email = "scott.mccarty@gmail.com" }]
keywords = ["log", "analysis", "syslog", "apache", "sysadmin", "deduplication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/crunchtools/petit"
Source = "https://github.com/crunchtools/petit"
Changelog = "https://github.com/crunchtools/petit/blob/master/CHANGELOG.md"

[project.scripts]
petit = "petit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/petit"]

[tool.hatch.build.targets.sdist]
include = ["src/petit", "README.md", "COPYING", "CHANGELOG.md", "AUTHORS", "test"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "ARG", "PLC", "PLE", "PLR", "PLW", "RUF"]
ignore = [
    "PLR2004",  # magic numbers ok — sample sizes, field counts, etc. are self-explanatory in context
    "PLR0913",  # many arguments ok for driver/graph constructors
    "N999",     # CrunchLog.py/LogGraph.py/LogHash.py/Filter.py are the public import surface
                # (`from petit.CrunchLog import CrunchLog`); renaming to lowercase is a breaking
                # change out of scope for this pass
    "DTZ001",   # petit's whole domain is naive local-time log timestamps — syslog carries no
    "DTZ005",   # timezone, so there is nothing to attach. Timezone-aware datetimes would
    "DTZ011",   # misrepresent data that was never tz-qualified to begin with.
]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"test/*" = [
    "PLR2004",
    "E501",  # the fixtures are real syslog lines. petit is a log analyser, and a
             # log line is one line -- wrapping one to fit 100 columns changes the
             # input under test into something no syslog would emit. Five lines
             # exceed it by 1-3 characters. `ruff check .` reached these for the
             # first time under python-sdlc; the old CI never linted test/.
]
"src/petit/api.py" = [
    "N813",  # `from . import CrunchLog as _drivers` avoids shadowing the CrunchLog class also
             # imported in this file; the module genuinely is named CrunchLog
]
"src/petit/LogGraph.py" = [
    "C901",     # GraphHash.display() renders one graph in one pass — normalize, draw bars, label
    "PLR0912",  # the axis — covered end-to-end by test_cli.py's fixture regression tests; splitting
                # it up would scatter one coherent, already-verified rendering routine
]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

# mypy covers `src`, which is what the old CI checked (`mypy src`). The test
# suite is unannotated and `strict = true` produced 261 no-untyped-def and
# no-untyped-call findings there -- not one of them a type error. Relaxing the
# annotation rules for the tests alone did not work: a per-module override
# keyed on "test.*" matches nothing because `test/` has no __init__.py, "test_*"
# did not match either, and naming `test_streaming` explicitly crashed mypy
# 2.4.0. Rather than fight the tool or widen the ignore, the scope stays where
# the old CI had it and annotating the suite is tracked separately.

[tool.sdlc.push]
# No in-repo Semgrep rules: the check exits 2 when .semgrep is absent
# rather than scanning nothing and calling it a pass.
skip = ["semgrep"]


[tool.sdlc]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
publish = "pypi"
repo-kinds = ["cli-tool"]
# The root Containerfile is gated only when the container stack is named.
stacks = ["python", "container"]

[tool.sdlc.image]
# Written by crunchtools/sdlc's scripts/convert_repo.py: moved from the workflows.
image = "quay.io/crunchtools/petit"
boot = "none"
boot-none-reason = "a CLI, not a service: the ci check contract runs the built image's petit against the fixture (crunchtools/sdlc#118)"

[tool.sdlc.ci]
# The pkg-* checks are the pull request half of packages.yml: each builds
# packaging/Containerfile for one target distro, and fails the build if the
# package will not install there or petit's output differs from test/output/.
# They share one tag, so they are one lane and run in turn: the stage, rpm
# and deb layers are built by the first and cached for the rest.
checks = [
    "petit-image", "contract",
    "pkg-ubi8", "pkg-ubi9", "pkg-ubi10", "pkg-alma9", "pkg-centos10", "pkg-fedora", "pkg-al2023",
    "pkg-bci15", "pkg-bci16", "pkg-debian12", "pkg-debian13", "pkg-ubuntu24", "pkg-ubuntu26",
]

# packaging/Containerfile is not the image this repo publishes, but it is
# built on every pull request, so it is linted like the one that is.
[tool.sdlc.ci.containerfile-lint]
containerfiles = ["Containerfile", "packaging/Containerfile"]

# Was container.yml's boot-command: the image this change builds prints its
# version and hashes the fixture log to the committed output.
[tool.sdlc.ci.petit-image]
kind = "image-build"
tag = "localhost/petit:test"

[tool.sdlc.ci.contract]
kind = "command"
image = "localhost/petit:test"
argv = ["python3", "test/image/contract.py"]

[tool.sdlc.ci.pkg-ubi8]
kind = "image-build"
containerfile = "packaging/Containerfile"
tag = "localhost/petit-packages:test"
build_args = {TARGET = "ubi8", PKG_KIND = "rpm", VERSION = "@project.version"}

[tool.sdlc.ci.pkg-ubi9]
kind = "image-build"
containerfile = "packaging/Containerfile"
tag = "localhost/petit-packages:test"
build_args = {TARGET = "ubi9", PKG_KIND = "rpm", VERSION = "@project.version"}

[tool.sdlc.ci.pkg-ubi10]
kind = "image-build"
containerfile = "packaging/Containerfile"
tag = "localhost/petit-packages:test"
build_args = {TARGET = "ubi10", PKG_KIND = "rpm", VERSION = "@project.version"}

[tool.sdlc.ci.pkg-alma9]
kind = "image-build"
containerfile = "packaging/Containerfile"
tag = "localhost/petit-packages:test"
build_args = {TARGET = "alma9", PKG_KIND = "rpm", VERSION = "@project.version"}

[tool.sdlc.ci.pkg-centos10]
kind = "image-build"
containerfile = "packaging/Containerfile"
tag = "localhost/petit-packages:test"
build_args = {TARGET = "centos10", PKG_KIND = "rpm", VERSION = "@project.version"}

[tool.sdlc.ci.pkg-fedora]
